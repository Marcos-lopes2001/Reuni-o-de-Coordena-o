<style>

  body { font-family:'Segoe UI',Roboto,sans-serif; background:#fff; color:#333; }
  a { text-decoration:none; }

  .header { background:#b8912a; padding:12px 40px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:1000; flex-wrap:wrap; gap:12px; }
  .header-brand { display:flex; align-items:center; gap:10px; color:#fff; font-weight:600; font-size:15px; }
  .header-brand img { width:32px; height:32px; border-radius:50%; background:#fff; padding:2px; }
  .nav { display:flex; gap:6px; flex-wrap:wrap; }
  .nav a { color:#fff; padding:6px 14px; font-size:13.5px; border-radius:4px; font-weight:500; }
  .nav a:hover, .nav a.active { background:rgba(255,255,255,0.15); }

  .banner { background:#d4a72c; color:#fff; text-align:center; padding:60px 20px; }
  .banner h1 { font-size:38px; font-weight:800; margin-bottom:6px; }
  .banner p { font-size:15px; opacity:0.95; }

  .container { max-width:1200px; margin:0 auto; padding:50px 20px; }

  .filters { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:32px; }
  .filters button { padding:8px 24px; border-radius:30px; border:1px solid #ecd9a0; background:#fff; color:#8a6a10; cursor:pointer; font-weight:600; font-size:13.5px; transition:0.2s; font-family:inherit; }
  .filters button:hover { background:#fdfaf3; }
  .filters button.active { background:#b8912a; color:#fff; border-color:#b8912a; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px; }
  .doc-card { background:#fdfaf3; border:1px solid #ecd9a0; border-radius:12px; padding:26px; transition:0.25s; display:flex; flex-direction:column; }
  .doc-card:hover { transform:translateY(-4px); box-shadow:0 10px 30px rgba(184,145,42,0.12); border-color:#b8912a; }
  .doc-card .icon { width:54px; height:54px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; background:#fff3e0; }
  .doc-card .icon i { color:#ea580c; font-size:26px; }
  .doc-card h4 { color:#333; font-size:15px; font-weight:700; margin-bottom:8px; line-height:1.4; }
  .doc-card p { color:#777; font-size:13px; margin-bottom:16px; line-height:1.5; flex:1; }
  .doc-card .meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .doc-card .tag-day { background:#f5e6b8; color:#8a6a10; padding:3px 12px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .doc-card .tag-type { padding:3px 12px; border-radius:20px; font-size:11.5px; font-weight:700; color:#fff; background:#ea580c; }
  .doc-card .btn-dl { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:#b8912a; color:#fff; padding:10px 20px; border-radius:30px; font-size:13px; font-weight:600; transition:0.2s; }
  .doc-card .btn-dl:hover { background:#8a6a10; }

  .footer { background:#8a6a10; color:rgba(255,255,255,0.85); text-align:center; padding:30px 20px; margin-top:40px; }
  .footer-links { display:flex; justify-content:center; gap:30px; margin-bottom:16px; flex-wrap:wrap; }
  .footer-links a { color:rgba(255,255,255,0.85); font-size:13px; }
  .footer hr { border:none; border-top:1px solid rgba(255,255,255,0.2); margin:12px auto; max-width:600px; }
  .footer p { font-size:12.5px; }

  @media(max-width:900px){
    .header{padding:10px 16px;}
    .banner h1{font-size:26px;}
    .container{padding:30px 16px;}

function render(filter) {
  const grid = document.getElementById('docsGrid');
  const filtered = filter === 'all' ? docs : docs.filter(d => d.f === filter);

  if (!filtered.length) {
    grid.innerHTML = '<p style="text-align:center;color:#999;grid-column:1/-1;padding:40px;">Nenhum documento disponível para este dia.</p>';
    return;
  }

  grid.innerHTML = filtered.map(d => `
    <div class="doc-card">
      <div class="icon">
        <i class="fas fa-file-powerpoint"></i>
      </div>
      <h4>${d.t}</h4>
      <p>${d.d}</p>
      <div class="meta">
        <span class="tag-day">${d.dia}</span>
        <span class="tag-type">${d.tipo.toUpperCase()}</span>
      </div>
      <a href="${d.file}" class="btn-dl" download>
        <i class="fas fa-download"></i> Descarregar
      </a>
    </div>
  `).join('');
}

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

render('all');
</script>
